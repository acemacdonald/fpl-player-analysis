[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-player-analysis"
version = "0.1.0"
description = "Premier League player analytics and weekly FPL decision support, built on the free official FPL API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Angus Macdonald" }]
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=14",
    "duckdb>=0.10",
    "jinja2>=3.1",
    "tabulate>=0.9",
    "scipy>=1.11",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "jupyter",
    "ipykernel",
    "matplotlib>=3.8",
]

[project.scripts]
fpl = "fpl_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fpl_analysis = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint.per-file-ignores]
"tests/synthetic.py" = ["E501"]   # fixture generator: long literal rows mirror the API payload

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
